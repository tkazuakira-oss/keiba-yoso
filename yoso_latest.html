  let delta = 0;
  // 展開・馬場：前有利/高速 → 逃げ・先行にプラス、差し有利/時計かかる → 差し・追込にプラス
  const paceDir = (bias.pace === "front" ? 1 : bias.pace === "close" ? -1 : 0)
                 + (bias.baba === "fast" ? 1 : bias.baba === "slow" ? -1 : 0);
  if (paceDir !== 0) {
    const frontStyle = (horse.style === "逃げ" || horse.style === "先行");
    const closeStyle = (horse.style === "差し" || horse.style === "追込");
    if (frontStyle) delta += paceDir * amount;
    if (closeStyle) delta -= paceDir * amount;
  }
  // 枠：内有利 → 内枠にプラス、外有利 → 外枠にプラス
  const wakuDir = (bias.waku === "in" ? 1 : bias.waku === "out" ? -1 : 0);
  if (wakuDir !== 0) {
    if (horse.wakuHalf === "内") delta += wakuDir * amount;
    if (horse.wakuHalf === "外") delta -= wakuDir * amount;
  }
  let p = horse.baseProb + delta;
  return Math.max(0, Math.min(100, p));
}

function flagFor(horse, prob) {
  if (prob === null) return "";
  const baseline = DATA.ninkiBaseline[String(horse.ninki)];
  if (baseline === undefined) return "";
  const diff = (prob / 100) - baseline;
  if (diff <= -DATA.flagThreshold) return '<span class="flag-warn">⚠️AI警告</span>';
  if (diff >= DATA.flagThreshold) return '<span class="flag-star">★AI注目</span>';
  return "";
}

function render() {
  const container = document.getElementById("races");
  container.innerHTML = "";
  DATA.races.forEach(race => {
    const card = document.createElement("div");
    card.className = "race-card";
    let rows = "";
    race.horses.forEach(h => {
      const p = adjustedProb(h);
      const pStr = p === null ? "-" : p.toFixed(1) + "%";
      rows += `<tr>
        <td>${h.ninki}</td>
        <td>${h.name}<br><span style="color:#999;font-size:11px;">${h.kishu} / ${h.waku}枠${h.umaban}番 / ${h.style}</span></td>
        <td>${h.odds.toFixed(1)}</td>
        <td class="prob">${pStr}</td>
        <td>${flagFor(h, p)}</td>
      </tr>`;
    });
    card.innerHTML = `<div class="race-title">${race.venue} ${race.raceNum}R ${race.raceName || ""}</div>
      <table>
        <tr><th>人気</th><th>馬名</th><th>単勝</th><th>AI複勝%</th><th></th></tr>
        ${rows}
      </table>`;
    container.appendChild(card);
  });
}
render();
</script>
</body>
